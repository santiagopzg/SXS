<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Para ti ♥</title>
<style>
  :root {
    --pink: #ff5d9e;
    --pink-soft: #ffb3d1;
    --ink: #07040a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000;
  }

  body {
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 50% 46%, rgba(255, 45, 120, .10) 0%, rgba(255, 45, 120, 0) 42%),
      #000;
  }

  .scene {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 42px 18px 34px;
  }

  .hint {
    margin: 0 0 22px;
    font: italic 300 clamp(.78rem, 2.6vw, .95rem)/1.4 Georgia, serif;
    letter-spacing: .16em;
    color: rgba(255, 183, 211, .62);
    text-transform: uppercase;
    text-align: center;
    animation: breathe 3.4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: .45; }
    50%      { opacity: 1; }
  }

  .heart-stage {
    position: relative;
    width: min(86vw, 540px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .heart {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 0 26px rgba(255, 45, 110, .28));
  }

  .heart-glow {
    transform-origin: 50% 55%;
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: .40; transform: scale(1); }
    50%      { opacity: .72; transform: scale(1.035); }
  }

  .piece {
    cursor: pointer;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .5s cubic-bezier(.2, .9, .25, 1), filter .4s ease;
    outline: none;
  }

  .piece:hover,
  .piece:focus-visible {
    transform: translateY(-2.2px) scale(1.012);
    filter: brightness(1.22) drop-shadow(0 0 10px rgba(255, 120, 175, .7));
  }

  .piece.opened {
    transform: scale(1.028);
    filter: brightness(1.32) drop-shadow(0 0 16px rgba(255, 110, 170, .85));
  }

  .piece-fill {
    transition: opacity .7s ease, filter .7s ease;
  }

  .piece-scratch {
    opacity: .85;
    transition: opacity .8s ease;
    pointer-events: none;
  }

  .piece.opened .piece-scratch { opacity: 0; }

  .scratch-lines path {
    stroke-linecap: round;
    opacity: .55;
    transition: opacity .45s ease, transform .6s ease;
    pointer-events: none;
  }

  .piece.opened .scratch-lines path {
    opacity: 0;
    transform: translate(-5px, -3px);
  }

  .piece-sheen {
    pointer-events: none;
    opacity: .35;
    transition: opacity .6s ease;
  }

  .piece.opened .piece-sheen { opacity: .75; }

  .heart-edge {
    pointer-events: none;
  }

  .numbers {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .number {
    position: absolute;
    top: 45.5%;
    transform: translate(-50%, -50%);
    width: clamp(26px, 7.4vw, 42px);
    height: clamp(26px, 7.4vw, 42px);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 600 clamp(.75rem, 2.3vw, 1rem)/1 Georgia, serif;
    color: #fff;
    background: rgba(10, 3, 8, .62);
    border: 1px solid rgba(255, 210, 230, .75);
    box-shadow: 0 0 14px rgba(255, 70, 140, .45), inset 0 0 10px rgba(255, 90, 150, .22);
    text-shadow: 0 0 8px rgba(255, 120, 175, .9);
    backdrop-filter: blur(2px);
  }

  .number.is-open {
    background: rgba(255, 80, 145, .95);
    border-color: #fff;
    color: #14040c;
    text-shadow: none;
    box-shadow: 0 0 26px rgba(255, 70, 140, .95);
  }

  .card-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 5;
  }

  .card {
    position: relative;
    width: min(86vw, 460px);
    max-height: min(64vh, 520px);
    overflow-y: auto;
    padding: 30px 30px 28px;
    border-radius: 22px;
    background:
      radial-gradient(circle at 12% 0%, rgba(255, 90, 155, .16), transparent 55%),
      linear-gradient(150deg, #200914 0%, #0d0409 70%);
    border: 1px solid rgba(255, 130, 180, .55);
    box-shadow: 0 22px 65px rgba(0, 0, 0, .85), 0 0 42px rgba(255, 45, 115, .30), inset 0 0 30px rgba(255, 60, 130, .07);
    opacity: 0;
    visibility: hidden;
    transform: scale(.78) translateY(16px);
    transform-origin: var(--origin, 50% 50%);
    transition: opacity .42s ease, transform .55s cubic-bezier(.16, 1, .3, 1), visibility .42s;
    pointer-events: none;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 110, 165, .6) transparent;
  }

  .card.show {
    opacity: 1;
    visibility: visible;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  .card::-webkit-scrollbar { width: 6px; }
  .card::-webkit-scrollbar-thumb {
    background: rgba(255, 110, 165, .55);
    border-radius: 99px;
  }

  .card-close {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 32px;
    height: 32px;
    border: 1px solid rgba(255, 175, 210, .35);
    border-radius: 50%;
    background: transparent;
    color: #ffc4dd;
    font: 400 1.25rem/1 Arial, sans-serif;
    cursor: pointer;
    transition: background .25s, color .25s, transform .25s;
  }

  .card-close:hover {
    background: rgba(255, 90, 150, .22);
    color: #fff;
    transform: rotate(90deg);
  }

  .card-tag {
    display: inline-block;
    margin-bottom: 14px;
    padding: 5px 13px;
    border-radius: 99px;
    font: 600 .72rem/1 Georgia, serif;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #ffd6e7;
    border: 1px solid rgba(255, 150, 195, .45);
    background: rgba(255, 75, 140, .12);
  }

  .card-text {
    margin: 0;
    font-size: clamp(.95rem, 2.9vw, 1.12rem);
    line-height: 1.72;
    color: #ffe8f1;
    text-shadow: 0 0 18px rgba(255, 90, 150, .18);
    overflow-wrap: anywhere;
  }

  .card-text .sign {
    display: block;
    margin-top: 16px;
    font-style: italic;
    color: #ff9ec5;
  }

  .spark {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffd0e2;
    box-shadow: 0 0 10px #ff4d96;
    pointer-events: none;
    z-index: 6;
    animation: fly .95s ease-out forwards;
  }

  @keyframes fly {
    from { opacity: 1; transform: translate(0, 0) scale(1); }
    to   { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(.2); }
  }

  .credit {
    margin: 18px 0 0;
    font: italic 400 clamp(2rem, 7vw, 3.1rem)/1 Georgia, "Times New Roman", serif;
    letter-spacing: .04em;
    color: #ffd0e3;
    text-shadow: 0 0 18px rgba(255, 65, 135, .75), 0 0 48px rgba(255, 40, 110, .35);
    animation: breathe 4.2s ease-in-out infinite;
  }

  @media (max-width: 480px) {
    .scene { padding: 30px 12px 26px; }
    .card { padding: 26px 20px 24px; }
    .hint { margin-bottom: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<main class="scene">
  <p class="hint">Toca cada parte del corazón</p>

  <div class="heart-stage" id="stage">
    <svg class="heart" viewBox="0 0 100 100" role="img" aria-label="Corazón dividido en cuatro partes interactivas">
      <defs>
        <path id="heartPath" d="M50 88 C46 84 10 59 10 34 C10 18 21 9 33 9 C41 9 47 13 50 19 C53 13 59 9 67 9 C79 9 90 18 90 34 C90 59 54 84 50 88 Z" />

        <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff9ec6"/><stop offset="55%" stop-color="#ff4d8d"/><stop offset="100%" stop-color="#d80a52"/>
        </linearGradient>
        <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffb7d6"/><stop offset="50%" stop-color="#ff5c9d"/><stop offset="100%" stop-color="#e3105c"/>
        </linearGradient>
        <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff8dbb"/><stop offset="55%" stop-color="#f52d76"/><stop offset="100%" stop-color="#c8064b"/>
        </linearGradient>
        <linearGradient id="grad4" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffc2dd"/><stop offset="50%" stop-color="#ff6bab"/><stop offset="100%" stop-color="#e51563"/>
        </linearGradient>

        <linearGradient id="sheen" x1="0" y1="0" x2=".85" y2="1">
          <stop offset="0%" stop-color="#fff" stop-opacity=".85"/>
          <stop offset="42%" stop-color="#fff" stop-opacity=".05"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>

        <pattern id="scratches" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
          <rect width="7" height="7" fill="rgba(90,0,35,.20)"/>
          <line x1="1" y1="0" x2="1" y2="7" stroke="#ffe0ee" stroke-width=".45" opacity=".55"/>
          <line x1="4.4" y1="0" x2="4.4" y2="7" stroke="#ff8bb9" stroke-width=".30" opacity=".45"/>
          <line x1="6.2" y1="0" x2="6.2" y2="7" stroke="#2b0012" stroke-width=".35" opacity=".45"/>
        </pattern>

        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4.5"/>
        </filter>

        <clipPath id="clip1"><rect x="9" y="5" width="19.8" height="88"/></clipPath>
        <clipPath id="clip2"><rect x="29.2" y="5" width="20.1" height="88"/></clipPath>
        <clipPath id="clip3"><rect x="49.7" y="5" width="20.1" height="88"/></clipPath>
        <clipPath id="clip4"><rect x="70.2" y="5" width="20.8" height="88"/></clipPath>
      </defs>

      <use href="#heartPath" class="heart-glow" fill="#ff2b72" opacity=".55" filter="url(#glow)"/>

      <g class="piece" data-i="0" clip-path="url(#clip1)" role="button" tabindex="0" aria-label="Parte 1 del corazón">
        <use href="#heartPath" class="piece-fill" fill="url(#grad1)"/>
        <use href="#heartPath" class="piece-scratch" fill="url(#scratches)"/>
        <use href="#heartPath" class="piece-sheen" fill="url(#sheen)"/>
        <g class="scratch-lines"></g>
      </g>
      <g class="piece" data-i="1" clip-path="url(#clip2)" role="button" tabindex="0" aria-label="Parte 2 del corazón">
        <use href="#heartPath" class="piece-fill" fill="url(#grad2)"/>
        <use href="#heartPath" class="piece-scratch" fill="url(#scratches)"/>
        <use href="#heartPath" class="piece-sheen" fill="url(#sheen)"/>
        <g class="scratch-lines"></g>
      </g>
      <g class="piece" data-i="2" clip-path="url(#clip3)" role="button" tabindex="0" aria-label="Parte 3 del corazón">
        <use href="#heartPath" class="piece-fill" fill="url(#grad3)"/>
        <use href="#heartPath" class="piece-scratch" fill="url(#scratches)"/>
        <use href="#heartPath" class="piece-sheen" fill="url(#sheen)"/>
        <g class="scratch-lines"></g>
      </g>
      <g class="piece" data-i="3" clip-path="url(#clip4)" role="button" tabindex="0" aria-label="Parte 4 del corazón">
        <use href="#heartPath" class="piece-fill" fill="url(#grad4)"/>
        <use href="#heartPath" class="piece-scratch" fill="url(#scratches)"/>
        <use href="#heartPath" class="piece-sheen" fill="url(#sheen)"/>
        <g class="scratch-lines"></g>
      </g>

      <use href="#heartPath" class="heart-edge" fill="none" stroke="rgba(255,190,220,.55)" stroke-width=".35"/>
    </svg>

    <div class="numbers" aria-hidden="true">
      <span class="number" style="left:19%">1</span>
      <span class="number" style="left:39.5%">2</span>
      <span class="number" style="left:60%">3</span>
      <span class="number" style="left:80.5%">4</span>
    </div>

    <div class="card-layer">
      <article class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="cardTag">
        <button class="card-close" id="cardClose" aria-label="Cerrar mensaje">×</button>
        <span class="card-tag" id="cardTag">Parte 1</span>
        <p class="card-text" id="cardText"></p>
      </article>
    </div>
  </div>

  <p class="credit">para tu</p>
</main>

<script>
  const messages = [
    "the world is yours chica and my world is yours",
    "dumb guy in love for this pink beauty",
    "Una de las COSAS QUE NO TE DIJE es que entre mas conozco a la WLFGRL mas me enamoro con el pasar del tiempo",
    "Espero que te haya gustado este detallito para ti que la verdad tenia muchos nervios de hacer esto ya que no sabria como reaccionarias y aparte es mi primera vez pues haciendo esto pero la verdad quiero seguir mejorando solo para demostrarte lo que importas para mi actualmente, espero que te haya gustado Миша Я тебя люблю..."
  ];

  const origins = ["18% 50%", "40% 50%", "60% 50%", "82% 50%"];
  const stripRanges = [[10, 29], [29.5, 49.5], [50, 70], [70.5, 90]];

  const stage = document.getElementById("stage");
  const card = document.getElementById("card");
  const cardTag = document.getElementById("cardTag");
  const cardText = document.getElementById("cardText");
  const cardClose = document.getElementById("cardClose");
  const pieces = [...document.querySelectorAll(".piece")];
  const numbers = [...document.querySelectorAll(".number")];

  // Rayitas aleatorias sobre cada pieza, para reforzar el efecto "rozado".
  const SVG_NS = "http://www.w3.org/2000/svg";
  pieces.forEach((piece, i) => {
    const group = piece.querySelector(".scratch-lines");
    const [minX, maxX] = stripRanges[i];
    for (let n = 0; n < 16; n++) {
      const x = minX + Math.random() * (maxX - minX - 2);
      const y = 12 + Math.random() * 68;
      const len = 2 + Math.random() * 9;
      const tilt = (Math.random() - .5) * 3;
      const line = document.createElementNS(SVG_NS, "path");
      line.setAttribute("d", `M${x.toFixed(2)} ${y.toFixed(2)} l${len.toFixed(2)} ${tilt.toFixed(2)}`);
      line.setAttribute("stroke", n % 3 === 0 ? "#ffdcec" : "#7d0038");
      line.setAttribute("stroke-width", (.22 + Math.random() * .25).toFixed(2));
      line.style.transitionDelay = `${Math.random() * .22}s`;
      group.appendChild(line);
    }
  });

  function sparkle(x, y) {
    for (let i = 0; i < 14; i++) {
      const dot = document.createElement("span");
      const angle = (Math.PI * 2 * i) / 14 + Math.random() * .4;
      const dist = 38 + Math.random() * 78;
      dot.className = "spark";
      dot.style.left = x + "px";
      dot.style.top = y + "px";
      dot.style.setProperty("--sx", Math.cos(angle) * dist + "px");
      dot.style.setProperty("--sy", Math.sin(angle) * dist + "px");
      dot.style.animationDelay = (Math.random() * .1) + "s";
      stage.appendChild(dot);
      dot.addEventListener("animationend", () => dot.remove());
    }
  }

  function openPiece(index, element) {
    pieces.forEach(p => p.classList.remove("opened"));
    numbers.forEach(n => n.classList.remove("is-open"));
    element.classList.add("opened");
    numbers[index].classList.add("is-open");

    const text = messages[index];
    cardTag.textContent = `Parte ${index + 1}`;
    cardText.innerHTML = "";

    if (index === 3) {
      const parts = text.split("Миша");
      cardText.append(document.createTextNode(parts[0].trim() + " "));
      const sign = document.createElement("span");
      sign.className = "sign";
      sign.textContent = "Миша" + (parts[1] || "");
      cardText.appendChild(sign);
    } else {
      cardText.textContent = text;
    }

    card.style.setProperty("--origin", origins[index]);
    card.classList.remove("show");
    void card.offsetWidth; // reinicia la animación de entrada
    card.classList.add("show");
    card.scrollTop = 0;

    const rect = element.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    sparkle(
      rect.left + rect.width / 2 - stageRect.left,
      rect.top + rect.height / 2 - stageRect.top
    );
  }

  function closeCard() {
    card.classList.remove("show");
    pieces.forEach(p => p.classList.remove("opened"));
    numbers.forEach(n => n.classList.remove("is-open"));
  }

  pieces.forEach((piece, i) => {
    piece.addEventListener("click", () => openPiece(i, piece));
    piece.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openPiece(i, piece);
      }
    });
  });

  cardClose.addEventListener("click", closeCard);
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeCard();
  });
  document.addEventListener("click", event => {
    if (card.classList.contains("show") && !card.contains(event.target) && !event.target.closest(".piece")) {
      closeCard();
    }
  });
</script>
</body>
</html>
